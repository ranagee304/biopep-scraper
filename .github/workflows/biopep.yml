name: BIOPEP Scraper Pipeline

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install pak
        run: |
          Rscript -e 'install.packages("pak", repos="https://cloud.r-project.org")'

      - name: Install required packages
        run: |
          Rscript -e 'pak::pkg_install(c(
            "rvest",
            "stringr",
            "dplyr",
            "purrr",
            "furrr",
            "future",
            "openxlsx",
            "xml2",
            "httr"
          ))'

      - name: Test rvest
        run: |
          Rscript -e 'library(rvest); cat("rvest installed successfully\n")'

      - name: Run scraper
        run: |
          Rscript biopep_parallel.R

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: BIOPEP-results
          path: BIOPEP_sequences.xlsx
