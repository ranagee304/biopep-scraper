name: BIOPEP Scraper Pipeline

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rvest
            any::stringr
            any::dplyr
            any::purrr
            any::furrr
            any::future
            any::openxlsx
            any::xml2
            any::httr

      - name: Verify rvest
        run: |
          Rscript -e 'library(rvest); cat("RVEST OK\n")'

      - name: Run scraper
        run: |
          Rscript biopep_parallel.R

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: BIOPEP-results
          path: BIOPEP_sequences.xlsx
