name: BIOPEP Scraper Pipeline

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rvest
            any::stringr
            any::dplyr
            any::purrr
            any::furrr
            any::future
            any::openxlsx
            any::xml2
            any::httr

      - name: Check installed packages
        run: |
          Rscript -e 'library(rvest); sessionInfo()'

      - name: Show files
        run: ls -la

      - name: Run scraper
        run: |
          Rscript biopep_parallel.R

      - uses: actions/upload-artifact@v4
        with:
          name: BIOPEP-results
          path: BIOPEP_sequences.xlsx
