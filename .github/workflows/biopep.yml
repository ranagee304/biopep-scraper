name: BIOPEP Scraper Pipeline

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      # -----------------------------
      # SYSTEM DEPENDENCIES (IMPORTANT FIX)
      # -----------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      # -----------------------------
      # SETUP R PACKAGES (SAFE INSTALL)
      # -----------------------------
      - name: Install R packages
        run: |
          Rscript -e 'install.packages("rvest", repos="https://cloud.r-project.org")'
          Rscript -e 'install.packages("stringr", repos="https://cloud.r-project.org")'
          Rscript -e 'install.packages("dplyr", repos="https://cloud.r-project.org")'
          Rscript -e 'install.packages("purrr", repos="https://cloud.r-project.org")'
          Rscript -e 'install.packages("furrr", repos="https://cloud.r-project.org")'
          Rscript -e 'install.packages("future", repos="https://cloud.r-project.org")'
          Rscript -e 'install.packages("openxlsx", repos="https://cloud.r-project.org")'

      # -----------------------------
      # RUN YOUR R SCRIPT
      # -----------------------------
      - name: Run scraper
        run: Rscript biopep_parallel.R

      # -----------------------------
      # UPLOAD OUTPUT FILE
      # -----------------------------
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: biopep-results
          path: BIOPEP_sequences.xlsx
