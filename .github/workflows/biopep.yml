name: BIOPEP Scraper

on:
  workflow_dispatch:

jobs:
  scrape:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Run scraper
        run: |
          Rscript scraper.R

      - name: Upload Excel
        uses: actions/upload-artifact@v4
        with:
          name: BIOPEP-results
          path: BIOPEP_ALL_sequences.xlsx
