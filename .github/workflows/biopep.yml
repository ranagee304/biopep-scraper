name: BIOPEP Parallel Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "rvest",
            "stringr",
            "dplyr",
            "purrr",
            "furrr",
            "future",
            "openxlsx"
          ), repos="https://cloud.r-project.org")'

      - name: Run scraper
        run: Rscript scraper.R

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: biopep-output
          path: BIOPEP_PARALLEL.xlsx
